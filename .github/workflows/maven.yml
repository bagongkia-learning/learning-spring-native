name: stev-report
on:
  push:
    tags:
      - "v*"
    branches:
      - 'main'

jobs:
  build-non-windows-image:
    name: 'Build Non-Windows Image'
    strategy:
      matrix:
        os: ['macos-latest']
        include:
          - os: 'macos-latest'
            label: 'mac'
    runs-on: ${{matrix.os}}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 11'
        uses: actions/setup-java@v5
        with:
          java-version: 11

      - name: Setup GraalVM
        uses: DeLaGuardo/setup-graalvm@master
        with:
          graalvm: 21.3.0
          java: java11

      - name: 'Install Native Image Plugin'
        run: |
          gu install native-image
          
      - name: 'Change Maven Mode'
        run: |
          chmod 755 mvnw
          
      - name: 'Build Native Image'
        run: |
          ./mvnw -Pnative package -DskipTests 
          
      - name: 'List Target'
        run: |
          ls target
          
      - name: 'Change mode'
        run: |
          chmod 755 target/stev-report
          
      - name: 'Publish Native Image'
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 'stev-report'
          path: target/stev-report
          
      - name: 'Create Release and Upload Asset'
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          files: target/stev-report
          name: Release ${{github.ref_name}}
          body: |
            Initial release
          draft: false
          prerelease: false

      - name: 'Write Upload URL To File'
        run: |
          echo "Release URL: https://github.com{{ github.repository }}/releases/tag/${{ github.ref_name }}" > upload_url.txt
          
      - name: 'Publish Upload URL'
        uses: actions/upload-artifact@v4
        with:
          name: 'upload_url.txt'
          path: 'upload_url.txt'
